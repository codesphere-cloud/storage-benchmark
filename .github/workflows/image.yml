name: Build benchmark image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: storage-benchmark:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run benchmark smoke test
        run: |
          docker volume create storage-benchmark-smoke
          docker run --rm \
            -e SMALLFILE_THREADS=1 \
            -e SMALLFILE_FILES=10 \
            -e LARGE_FILE_SIZE=16M \
            -v storage-benchmark-smoke:/home/user/app \
            storage-benchmark:test \
            bash -lc 'check-storage-benchmark-tools && storage-benchmark && test -s benchmark-results/latest.txt'
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
